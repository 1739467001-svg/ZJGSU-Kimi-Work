# 商大元境 · CampusTwin X —— Nginx 站点配置
# 单页应用(SPA):所有非文件路径回退到 index.html,由前端路由接管。

server {
    listen       80;
    server_name  _;   # 绑定域名时改成你的域名,如 campus.example.com

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩:three.js vendor chunk 约 1MB,gzip 后约 270KB
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      image/svg+xml application/wasm;

    # 带内容哈希的构建产物:长缓存(一年),内容变了文件名自然变
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 校园数据(JSON):短缓存 5 分钟,便于将来替换为真实后端前的调试
    location /data/ {
        expires 5m;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 入口页不缓存,保证发版即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 其余一切路径 → SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
